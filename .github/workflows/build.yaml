on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
      - release/*

name: Continuous integration

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - 1.86.0 # Rust MSRV
    steps:
      - uses: actions/checkout@v6
      - run: rustup override set profile minimal && rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo check --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - 1.86.0 # Rust MSRV
    steps:
      - uses: actions/checkout@v6
      - run: rustup override set profile minimal && rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo clippy --all-targets -- -D warnings