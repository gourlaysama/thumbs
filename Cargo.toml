[workspace]
resolver = "3"

[workspace.package]
authors = ["Antoine Gourlay <antoine@gourlay.fr>"]
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"

# Global dependencies
[workspace.dependencies]
globset = "0.4"
log = "0.4"
clap = { version = "4.4.1", features = ["derive", "cargo", "wrap_help"] }

[profile.release]
lto = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(not_build_rs)'] }
unsafe_code = "forbid"

# Cli package

[package]
name = "thumbs"
version = "0.5.0-alpha.0"
description = "A CLI tool to manage the cached thumbnails for files."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
anyhow = "1.0.22"
clap = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"]}
globset = { workspace = true }
humantime = "2"
log = { workspace = true }
serde = { version = "1", features = ["derive"] }
url = "2"
thumbs-rs = { path = "thumbs-rs" }

[build-dependencies]
build-info-build = "0.0.42"
anyhow = "1"
clap = { workspace = true }
clap_complete = "4"
log = "0.4"
serde = { version = "1", features = ["derive"] }

[package.metadata.deb]
priority = "optional"
assets = [
    [
        "target/x86_64-unknown-linux-musl/release/thumbs",
        "usr/bin/",
        "755",
    ],
    [
        "README.md",
        "usr/share/doc/thumbs/",
        "644",
    ],
    [
        "CHANGELOG.md",
        "usr/share/doc/thumbs/",
        "644",
    ],
    [
        "LICENSE",
        "usr/share/doc/thumbs/",
        "644",
    ],
    [
        "NOTICE",
        "usr/share/doc/thumbs/",
        "644",
    ],
    [
        "extra/nautilus/thumbs-nautilus.py",
        "use/share/nautilus-python/extensions/",
        "644",
    ],
    [
        "complete/thumbs.bash",
        "usr/share/bash-completion/completions/thumbs",
        "644",
    ],
    [
        "complete/thumbs.fish",
        "usr/share/fish/vendor_completions.d/",
        "644",
    ],
    [
        "complete/_thumbs",
        "usr/share/zsh/site-functions/",
        "644",
    ],
    [
        "thumbs.1.gz",
        "usr/share/man/man1/thumbs.1.gz",
        "644",
    ],
]

[lints]
workspace = true
